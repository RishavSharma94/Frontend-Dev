<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo Classes Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Pseudo Classes Demo</h2>

  <div class="container">
    <div class="box">
      <p><b>:hover</b> - changes color when you move mouse on it</p>
      <a href="#">Hover on this link</a>
    </div>

    <div class="box">
      <p><b>:focus</b> - works when input box is clicked</p>
      <input type="text" placeholder="Click here">
    </div>

    <div class="box">
      <p><b>:active</b> - works when button is pressed</p>
      <button>Click Me</button>
    </div>

    <div class="box">
      <p><b>:nth-child()</b> - style specific list items</p>
      <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
      </ul>
    </div>
  </div>
</body>
</html>
