<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>CSS Tooltip Demo</h2>

    <div class="main-box">
        <div class="tooltip">
            😊
            <span class="tooltiptext">This is a smile emoji</span>
        </div>

        <div class="tooltip">
            💡
            <span class="tooltiptext">This means idea</span>
        </div>

        <div class="tooltip">
            <span class="word">Hover Me</span>
            <span class="tooltiptext">I am a tooltip on text</span>
        </div>

        <div class="tooltip">
            ❤️
            <span class="tooltiptext">Love symbol</span>
        </div>
    </div>

</body>
</html>
