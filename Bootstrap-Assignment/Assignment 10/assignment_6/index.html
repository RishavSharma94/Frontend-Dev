<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container py-4">
    <h2>Notifications</h2>
    <div class="card p-3">
      <div class="alert alert-success" role="alert">
        <strong>Success!</strong> Your profile was updated.
      </div>
      <div class="alert alert-info" role="alert">
        Tip: Try the new dashboard filters.
      </div>
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <strong>Warning!</strong> Unusual activity detected.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      <div class="bg-light border p-3 mt-3">
        <h5>Summary</h5>
        <p class="mb-0">You have 2 unread messages and 1 pending task.</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
