<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minimal Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="py-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="mb-0 site-title">Notes & Ideas</h1>
      <nav><a class="btn btn-outline-primary" href="#">Subscribe</a></nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="row g-4">
        <div class="col-md-6">
          <article class="card h-100 themed-card">
            <div class="card-body">
              <h3 class="card-title">Designing for Calm</h3>
              <p class="card-text">Thoughts on reducing cognitive load in interfaces.</p>
              <a class="btn btn-primary" href="#">Read more</a>
            </div>
          </article>
        </div>
        <div class="col-md-6">
          <article class="card h-100 themed-card">
            <div class="card-body">
              <h3 class="card-title">Small Experiments</h3>
              <p class="card-text">How to run fast, low-cost product experiments.</p>
              <a class="btn btn-primary" href="#">Read more</a>
            </div>
          </article>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center">
    <small>© 2025 Notes & Ideas</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
