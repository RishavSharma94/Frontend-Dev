<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today's Menu — La Trattoria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="py-3 bg-light">
    <div class="container text-center">
      <h1 class="mb-0">La Trattoria</h1>
      <p class="lead mb-0">Today's Menu</p>
    </div>
  </header>

  <main class="py-4">
    <div class="container">
      <section class="mb-4">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Dish</th>
              <th>Category</th>
              <th class="text-end">Price</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>Margherita Pizza</td><td>Pizza</td><td class="text-end">₹450</td></tr>
            <tr><td>Caesar Salad</td><td>Starter</td><td class="text-end">₹300</td></tr>
            <tr><td>Spaghetti Carbonara</td><td>Pasta</td><td class="text-end">₹520</td></tr>
          </tbody>
        </table>
      </section>

      <section class="mb-4">
        <h4>Chef's Specials</h4>
        <ul class="list-group">
          <li class="list-group-item">Truffle Risotto — ₹650</li>
          <li class="list-group-item">Lemon Herb Salmon — ₹720</li>
        </ul>
      </section>

      <figure class="figure mt-4 text-center">
        <img src="https://via.placeholder.com/700x350?text=Chef+Special" class="figure-img img-fluid rounded" alt="dish">
        <figcaption class="figure-caption">Our signature dish of the day.</figcaption>
      </figure>
    </div>
  </main>

  <footer class="py-3 text-center">
    <small>Open daily • 11:00 — 23:00</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
