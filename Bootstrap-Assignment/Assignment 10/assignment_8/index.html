<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container py-5">
    <h2 class="text-center mb-4">Choose Your Plan</h2>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card h-100 shadow-lg plan-card">
          <div class="card-body">
            <h4>Basic</h4>
            <h2>₹499</h2>
            <ul>
              <li>1 project</li>
              <li>Basic support</li>
            </ul>
            <a class="btn btn-outline-primary" href="#">Select</a>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card h-100 text-white bg-primary shadow-lg plan-card">
          <div class="card-body">
            <h4>Pro</h4>
            <h2>₹1299</h2>
            <ul>
              <li>Unlimited projects</li>
              <li>Priority support</li>
            </ul>
            <a class="btn btn-light" href="#">Get Pro</a>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card h-100 shadow-lg plan-card">
          <div class="card-body">
            <h4>Enterprise</h4>
            <h2>Contact</h2>
            <ul>
              <li>Custom solutions</li>
              <li>Dedicated support</li>
            </ul>
            <a class="btn btn-outline-primary" href="#">Contact Sales</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
