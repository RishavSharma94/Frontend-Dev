<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel — Explore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="py-3 bg-dark text-white">
    <div class="container">
      <h2 class="mb-0">GlobeTrek</h2>
    </div>
  </header>

  <main class="container py-4">
    <div id="destCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="4000">
          <img src="https://via.placeholder.com/1200x400?text=Maldives" class="d-block w-100" alt="Maldives">
          <div class="carousel-caption d-none d-md-block">
            <h5>Maldives</h5>
            <p>Relax on white-sand beaches.</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="3000">
          <img src="https://via.placeholder.com/1200x400?text=Swiss+Alps" class="d-block w-100" alt="Swiss Alps">
          <div class="carousel-caption d-none d-md-block">
            <h5>Swiss Alps</h5>
            <p>Snow-capped adventures.</p>
          </div>
        </div>
        <div class="carousel-item" data-bs-interval="5000">
          <img src="https://via.placeholder.com/1200x400?text=Kyoto" class="d-block w-100" alt="Kyoto">
          <div class="carousel-caption d-none d-md-block">
            <h5>Kyoto</h5>
            <p>Culture and tranquillity.</p>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#destCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#destCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
      </button>
    </div>

    <div class="mt-4">
      <label class="form-label">Booking Completion</label>
      <div class="progress" style="height:1.5rem;">
        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 70%;">70%</div>
      </div>
    </div>
  </main>

  <footer class="py-4 bg-light">
    <div class="container text-center">
      <p class="mb-0">Contact: travel@globetrek.example • +91 98765 43210</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
